<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panta · 我的文件库</title><link rel="stylesheet" href="/assets/library.css"><script src="/assets/resource-display.js" defer></script><script src="/assets/file-catalog.js" defer></script><script src="/assets/library.js" defer></script><script src="/assets/library-sharing.js" defer></script></head>
<body>
 <header class="site-header"><a class="wordmark" href="/" aria-label="Panta 首页">Panta<span>.</span></a><span class="header-caption">让好内容，触手可及</span><div id="account" class="account" hidden><a id="admin-link" href="/admin/" hidden>管理后台</a><span id="login-name"></span><button id="logout" class="text-button" type="button">退出</button></div></header>
 <main id="login-view" class="login-view"><p class="eyebrow">YOUR PERSONAL LIBRARY</p><h1>你的文件，<br>不止于存放。</h1><p class="intro">软件、视频、文档，在这里找到。</p><form id="login-form" class="login-form"><h2>登录文件库</h2><label for="account-name">账号</label><input id="account-name" autocomplete="username" required minlength="3" maxlength="64"><label for="account-password">密码</label><input id="account-password" type="password" autocomplete="current-password" required minlength="12" maxlength="72"><p id="login-error" role="alert" class="error" hidden></p><button id="login-submit" class="primary" type="submit">进入文件库</button></form></main>
 <main id="library-view" class="library" hidden>
  <section class="library-heading"><div><p class="eyebrow">COLLECTED. CONNECTED. YOURS.</p><h1 id="library-title">我的文件库</h1><p class="intro">少一点翻找，多一点发现。</p></div><button id="refresh" class="text-button" type="button">刷新文件</button></section>
  <section class="file-browser" aria-label="我的文件">
   <div class="library-tools"><nav class="categories" aria-label="文件分类"><button id="category-all" type="button" aria-pressed="true">全部 <span id="count-all"></span></button><button id="category-software" type="button" aria-pressed="false">软件 <span id="count-software"></span></button><button id="category-video" type="button" aria-pressed="false">视频 <span id="count-video"></span></button><button id="category-document" type="button" aria-pressed="false">文档 <span id="count-document"></span></button><button id="category-other" type="button" aria-pressed="false">其他 <span id="count-other"></span></button></nav><label class="search-box"><span class="sr-only">搜索已加载的文件名</span><input id="file-search" type="search" maxlength="256" placeholder="搜索文件名"></label></div>
   <div class="collection-bar"><p id="collection-status" role="status" aria-live="polite">正在整理你的文件…</p><div class="view-switch" role="group" aria-label="文件展示方式"><button id="view-cards" type="button" aria-pressed="true">卡片</button><button id="view-list" type="button" aria-pressed="false">列表</button></div></div>
   <p id="library-error" class="error" role="alert" hidden></p>
   <div id="file-grid" class="file-grid"></div>
   <div id="file-list" class="list-scroll" hidden><table><thead><tr><th>文件名</th><th>类型</th><th>大小</th></tr></thead><tbody id="file-rows"></tbody></table></div>
   <div id="files-empty" class="empty" hidden><h2 id="empty-title">还没有找到文件</h2><p id="empty-description"></p></div>
   <div class="collection-bar"><button id="file-page-prev" class="secondary" type="button" disabled>上一页文件</button><span id="file-page-status" role="status"></span><button id="file-page-next" class="secondary" type="button" disabled>下一页文件</button></div>
   <div class="load-footer"><p id="load-status" role="status" aria-live="polite"></p><button id="load-pause" class="secondary" type="button" hidden>暂停加载</button><button id="load-more" class="secondary" type="button" hidden>加载更多文件</button></div>
  </section>
  <button id="my-shares" class="secondary" type="button" hidden>我的分享</button>
  <section id="file-detail" class="file-detail" aria-labelledby="detail-title" hidden tabindex="-1"><div class="detail-heading"><span id="detail-format" class="format"></span><button id="detail-close" class="text-button" type="button">关闭详情</button></div><h2 id="detail-title"></h2><dl><div><dt>文件类型</dt><dd id="detail-type"></dd></div><div><dt>文件大小</dt><dd id="detail-size"></dd></div></dl><p id="detail-note" class="detail-note"></p><div class="file-actions"><a id="file-download" class="primary download-link" hidden>下载原文件</a><button id="file-share" class="secondary" type="button" hidden>分享文件</button></div><p id="download-status" role="status"></p>
   <form id="share-form" class="share-form" hidden><h3>创建文件分享</h3><label for="share-duration">有效期</label><select id="share-duration"><option value="5m">5 分钟</option><option value="1h" selected>1 小时</option><option value="6h">6 小时</option><option value="24h">24 小时</option><option value="7d">7 天</option></select><label for="share-code">提取码（随机 4 位字母或数字，清空则无需验证）</label><input id="share-code" type="text" autocomplete="off" minlength="4" maxlength="4" pattern="[A-Za-z0-9]{4}" aria-describedby="share-code-hint"><p id="share-code-hint">自动随机填入，可修改；删除全部字符后，分享无需提取码。</p><button id="share-create" type="submit" class="primary">创建分享链接</button><div id="share-result" hidden><label for="share-url">分享链接</label><input id="share-url" readonly><p id="share-code-result"></p><button id="share-copy" type="button" class="secondary">复制分享信息</button></div><p id="share-status" role="status" aria-live="polite"></p></form>
   <p id="preview-status" class="preview-status" role="status" aria-live="polite"></p><div id="file-preview" class="file-preview"></div></section>
  <section id="my-shares-panel" class="file-detail" hidden><div class="detail-heading"><h2>我的分享</h2><button id="shares-close" class="text-button" type="button">关闭分享列表</button></div><div id="owned-shares"></div><p id="shares-status" role="status" aria-live="polite"></p></section>
 </main>
 <footer class="site-footer"><a class="wordmark small" href="/">Panta<span>.</span></a><p>文件留在你的网盘，好内容汇集于此。</p><small id="library-scope">当前展示已接入的真实文件，不代表整个网盘。</small></footer>
</body></html>
