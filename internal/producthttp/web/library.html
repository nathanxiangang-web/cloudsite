<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cloudsite · 我的文件库</title><link rel="stylesheet" href="/assets/library.css"><script src="/assets/resource-display.js" defer></script><script src="/assets/file-catalog.js" defer></script><script src="/assets/file-surface.js" defer></script><script src="/assets/download-model.js" defer></script><script src="/assets/library.js" defer></script><script src="/assets/library-sharing.js" defer></script></head>
<body>
 <header class="site-header"><a class="wordmark" href="/" aria-label="cloudsite 首页">cloudsite<span>.</span></a><span class="header-caption">让好内容，触手可及</span><div id="account" class="account" hidden><a id="cloud-download-link" href="/downloads/" hidden>云下载</a><a id="admin-link" href="/admin/" hidden>管理后台</a><span id="login-name"></span><button id="logout" class="text-button" type="button">退出</button></div></header>
 <main id="login-view" class="login-view"><p class="eyebrow">YOUR PERSONAL LIBRARY</p><h1>你的文件，<br>不止于存放。</h1><p class="intro">软件、视频、文档，在这里找到。</p><form id="login-form" class="login-form"><h2 id="auth-title">登录文件库</h2><label for="account-name">账号</label><input id="account-name" autocomplete="username" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{2,63}"><label for="account-password">密码</label><input id="account-password" type="password" autocomplete="current-password" required minlength="6" maxlength="72"><div id="confirm-field" hidden><label for="account-confirm">确认密码</label><input id="account-confirm" type="password" autocomplete="new-password" minlength="6" maxlength="72"></div><p id="auth-help" hidden>账号为 3–64 位英文字母、数字或 . _ -，密码至少 6 个字符（最多 72 字节）。注册后即可浏览、预览和下载文件。</p><p id="login-error" role="alert" class="error" hidden></p><p id="auth-notice" role="status" hidden></p><button id="login-submit" class="primary" type="submit">进入文件库</button><button id="auth-toggle" class="text-button" type="button" hidden>没有账号？立即注册</button></form></main>
 <main id="library-view" class="library" hidden>
  <section class="library-heading"><div><p class="eyebrow">COLLECTED. CONNECTED. YOURS.</p><h1 id="library-title">我的文件库</h1><p class="intro">少一点翻找，多一点发现。</p></div><button id="refresh" class="text-button" type="button">刷新文件</button></section>
  <!--FILE_BROWSER-->
 </main>
 <footer class="site-footer"><a class="wordmark small" href="/">cloudsite<span>.</span></a><p>文件留在你的网盘，好内容汇集于此。</p><small id="library-scope">当前展示已接入的真实文件，不代表整个网盘。</small><small class="release-version">cloudsiteV1.0.0alpha</small></footer>
</body></html>
